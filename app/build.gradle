plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Load properties from local.properties (git-ignored file)
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

android {
    namespace 'com.example.barelabel'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.barelabel'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'

        // Inject USDA_API_KEY into BuildConfig
        buildConfigField "String", "USDA_API_KEY",
                "\"${localProperties.getProperty('USDA_API_KEY', '')}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Name the built APK barelabel-<variant>.apk instead of the default app-<variant>.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "barelabel-${variant.name}.apk"
        }
    }

    // Release signing comes from git-ignored local.properties (never commit the keystore):
    //   RELEASE_KEYSTORE_PATH=/absolute/path/to/barelabel-release.keystore
    //   RELEASE_KEYSTORE_PASSWORD=...
    //   RELEASE_KEY_ALIAS=barelabel
    //   RELEASE_KEY_PASSWORD=...
    // Generate once with:
    //   keytool -genkeypair -v -keystore barelabel-release.keystore -alias barelabel \
    //     -keyalg RSA -keysize 2048 -validity 10000
    signingConfigs {
        release {
            def keystorePath = localProperties.getProperty('RELEASE_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword localProperties.getProperty('RELEASE_KEYSTORE_PASSWORD')
                keyAlias localProperties.getProperty('RELEASE_KEY_ALIAS')
                keyPassword localProperties.getProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // Only sign when the keystore is configured; otherwise assemble an unsigned APK.
            if (localProperties.getProperty('RELEASE_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.browser:browser:1.8.0'
	implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
// Firebase Analytics (feature-level beaconing)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-analytics'
// ML Kit Barcode Scanning (Free & On-Device)
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // CameraX dependencies
    def camera_version = "1.3.4"
    implementation "androidx.camera:camera-core:${camera_version}"
    implementation "androidx.camera:camera-camera2:${camera_version}"
    implementation "androidx.camera:camera-lifecycle:${camera_version}"
    implementation "androidx.camera:camera-view:${camera_version}"

}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.jetbrains.kotlin" &&
            details.requested.name.startsWith("kotlin-stdlib")) {
            details.useVersion("1.8.22")
        }
    }
}
