plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Load properties from local.properties (git-ignored file)
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

android {
    namespace 'com.example.dirtyingredients'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.dirtyingredients'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'

        // Inject USDA_API_KEY into BuildConfig
        buildConfigField "String", "USDA_API_KEY",
                "\"${localProperties.getProperty('USDA_API_KEY', '')}\""
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.browser:browser:1.8.0'
	implementation 'com.google.android.flexbox:flexbox:3.0.0'
// Firebase Analytics (feature-level beaconing)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-analytics'
// ML Kit Barcode Scanning (Free & On-Device)
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // CameraX dependencies
    def camera_version = "1.3.4"
    implementation "androidx.camera:camera-core:${camera_version}"
    implementation "androidx.camera:camera-camera2:${camera_version}"
    implementation "androidx.camera:camera-lifecycle:${camera_version}"
    implementation "androidx.camera:camera-view:${camera_version}"

}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.jetbrains.kotlin" &&
            details.requested.name.startsWith("kotlin-stdlib")) {
            details.useVersion("1.8.22")
        }
    }
}
